[project]
name = "basics-of-neurons-and-networks"
version = "0.1.0"
description = "Educational Jupyter notebooks for NEURON basics (local Poetry env + Colab)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "neuron==9.0.2",
    "ipywidgets==7.7.1",
    "matplotlib>=3.7",
    "numpy>=1.23",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "notebook>=7.0",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
